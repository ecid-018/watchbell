<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- viewport-fit=cover is what makes env(safe-area-inset-*) resolve to real
         numbers on iOS. Without it the safe-area padding silently computes to 0. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"
    />

    <!-- Single JS-managed tag rather than two prefers-color-scheme tags: Auto/Light/Dark
         is a manual override inside the app, which a media query cannot see.
         Kept in sync with THEME[x].card by src/Watchbell.jsx. -->
    <meta name="theme-color" id="theme-color" content="#0E1C22" />

    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Watchbell" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="format-detection" content="telephone=no" />

    <link rel="apple-touch-icon" href="/icons/apple-touch-icon-180.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />

    <title>Watchbell</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
